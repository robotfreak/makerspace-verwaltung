<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Himalaya Webmail{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 250px;
        }
        body {
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            padding: 1rem;
            border-right: 1px solid var(--bs-border-color);
            overflow-y: auto;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        .email-list {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .email-item {
            cursor: pointer;
            border-bottom: 1px solid var(--bs-border-color);
            padding: 0.75rem;
            transition: background-color 0.2s;
        }
        .email-item:hover {
            background-color: var(--bs-tertiary-bg);
        }
        .email-item.unread {
            background-color: var(--bs-primary-bg-subtle);
            font-weight: 500;
        }
        .email-subject {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }
        .btn-compose {
            width: 100%;
            margin-bottom: 1rem;
        }
        .folder-link {
            display: block;
            padding: 0.5rem;
            color: var(--bs-body-color);
            text-decoration: none;
            border-radius: 0.25rem;
        }
        .folder-link:hover,
        .folder-link.active {
            background-color: var(--bs-primary-bg-subtle);
            color: var(--bs-primary);
        }
        .email-body {
            white-space: pre-wrap;
            font-family: monospace;
            background: var(--bs-tertiary-bg);
            padding: 1rem;
            border-radius: 0.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }
        .email-header {
            border-bottom: 1px solid var(--bs-border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--bs-border-color);
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar bg-body-tertiary">
        <h4 class="mb-3">
            <i class="bi bi-envelope-at"></i> Himalaya
        </h4>
        <a href="{{ url_for('compose') }}" class="btn btn-primary btn-compose">
            <i class="bi bi-pencil-square"></i> Neue E-Mail
        </a>
        
        <hr>
        
        <h6 class="text-muted mb-2">Ordner</h6>
        <a href="{{ url_for('inbox') }}" class="folder-link {% if request.endpoint == 'inbox' %}active{% endif %}">
            <i class="bi bi-inbox"></i> Inbox
        </a>
        <a href="{{ url_for('folders') }}" class="folder-link {% if request.endpoint == 'folders' %}active{% endif %}">
            <i class="bi bi-folder"></i> Alle Ordner
        </a>
        
        <hr>
        
        <small class="text-muted">
            peter@berlincreators.de
        </small>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
