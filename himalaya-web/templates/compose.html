{% extends "base.html" %}

{% block title %}Neue E-Mail - Himalaya Webmail{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-pencil-square"></i> Neue E-Mail</h2>

<form action="{{ url_for('send_email') }}" method="POST">
    <div class="mb-3">
        <label for="to" class="form-label"><i class="bi bi-person"></i> An:</label>
        <input type="email" class="form-control" id="to" name="to" 
               value="{{ request.args.get('to', '') }}" required>
    </div>
    
    <div class="mb-3">
        <label for="subject" class="form-label"><i class="bi bi-subject"></i> Betreff:</label>
        <input type="text" class="form-control" id="subject" name="subject" required>
    </div>
    
    <div class="mb-3">
        <label for="body" class="form-label"><i class="bi bi-card-text"></i> Nachricht:</label>
        <textarea class="form-control" id="body" name="body" rows="15" required></textarea>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-send"></i> Senden
        </button>
        <a href="{{ url_for('inbox') }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg"></i> Abbrechen
        </a>
    </div>
</form>
{% endblock %}
